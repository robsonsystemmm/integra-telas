<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Financeiro – Módulo QGD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#e2e5ea;--pr:#1f5eff;--ok:#12a150;--wa:#e8a900;--er:#d92d20;--in:#0e8fd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--tx:#e8ebf1;--mu:#98a2b3;--bd:#2d3441;--pr:#6b95ff}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2029;--tx:#e8ebf1;--mu:#98a2b3;--bd:#2d3441;--pr:#6b95ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 18px 0}h1{font-size:20px;margin:0 0 10px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);padding:0 14px;background:var(--card)}
nav button{border:0;background:none;color:var(--mu);padding:11px 12px;cursor:pointer;font:inherit;white-space:nowrap;border-bottom:2px solid transparent}
nav button.on{color:var(--pr);border-color:var(--pr);font-weight:600}
main{padding:16px 18px;max-width:1300px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:21px}
h2{font-size:15px;margin:0 0 10px}
.sc{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600;background:var(--bg)}td.n,th.n{text-align:right}
tr.g td{background:var(--bg);font-weight:700}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
td input{width:122px;text-align:right}td input[readonly]{background:var(--bg);border-color:transparent;cursor:not-allowed}
button.b{background:var(--pr);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ok{background:var(--ok)}.wa{background:var(--wa)}.er{background:var(--er)}.in{background:var(--in)}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;background:color-mix(in srgb,var(--wa) 18%,var(--card));border:1px solid var(--wa)}
.bar{height:10px;background:var(--bd);border-radius:5px;position:relative;min-width:110px}.bar i{display:block;height:100%;border-radius:5px}.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx)}
.mu{color:var(--mu)}.x{color:var(--er);cursor:pointer;border:0;background:none}
@media print{aside,nav,.row,.x,button{display:none!important}.gt{max-height:none!important}}
.rk{padding:8px 0;border-bottom:1px solid var(--bd)}.rk:last-child{border-bottom:0}.rk1{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}.rkn{width:26px;flex:none}.rkt{flex:1;min-width:0;overflow-wrap:anywhere}.rkv{flex:none;text-align:right;white-space:nowrap}.rk .bar{min-width:0}
.dx td,.dx th{white-space:normal}.dx td.n,.dx th.n{white-space:nowrap}
.stk{position:sticky;left:0;background:var(--card);z-index:1;min-width:260px;max-width:320px;white-space:normal}
.gt{overflow:auto;max-height:68vh}.gtb thead th{position:sticky;top:0;z-index:2}.gtb thead th.stk{z-index:3}
.gtb tbody tr:not(.g):hover td{background:color-mix(in srgb,var(--pr) 7%,var(--card))}.gtb td.cur,.gtb th.cur{background:color-mix(in srgb,var(--wa) 16%,var(--card))}
@media (max-width:720px){.stk{min-width:170px}}
.app{display:flex}.ct{flex:1;min-width:0}aside{width:210px;flex:none;background:var(--card);border-right:1px solid var(--bd);padding:14px 8px}
.sbt{font-weight:700;font-size:15px;padding:6px 10px 10px}aside a{display:block;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--tx);margin-bottom:2px}aside a.on{background:color-mix(in srgb,var(--pr) 14%,var(--card));color:var(--pr);font-weight:600}aside a.sub{margin-left:14px;font-size:13px;font-weight:400}
@media (max-width:720px){.app{flex-direction:column}aside{width:auto;border-right:0;border-bottom:1px solid var(--bd);display:flex;gap:4px;overflow-x:auto;padding:8px}.sbt{display:none}aside a{white-space:nowrap}aside a.sub{margin-left:0}}
</style></head><body>
<div class="app"><aside id="sb"></aside><div class="ct"><header><h1 id="ttl">Financeiro</h1><span id="st" class="mu"></span></header>
<nav id="nav"></nav><main id="m"></main></div></div>
<div id="md" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:50;padding:16px"></div><div id="tt" style="display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60"></div>
<script>
const TABS=[['dash','Dashboard'],['rub','Rubricas'],['gas','Gastos mensais'],['aju','Aditivos / Remanejamentos'],['for','Fornecedores'],['rep','Repasses'],['his','Histórico'],['pro','Projeto']];
const DG=()=>[[1,'PESSOAL E ENCARGOS SOCIAIS (A)'],[2,'DESPESAS GERAIS (B)'],[3,'DEMAIS DESPESAS (C)'],[4,'CUSTOS INDIRETOS (D)']].map(x=>({id:'g'+x[0],n:x[0],nome:x[1]}));
const newP=n=>({id:uid(),cod:'',grupos:DG(),proj:{nome:n||'',inicio:'',fim:''},rub:[],gastos:{},ajustes:[],repasses:[]});
let ST={projetos:[],sel:null},S={proj:{nome:'',inicio:'',fim:''},rub:[],gastos:{},ajustes:[],repasses:[]},view='geral',gsel='',tab='dash',db=null,ref=null,ready=false,flt={g:'',a:'',y:'',m:''};
const $=s=>document.querySelector(s),R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),P=v=>(v*100).toFixed(0)+'%';
const uid=()=>Math.random().toString(36).slice(2,9),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
/* ---------- persistência ---------- */
let cref=null,lastSaved={},ME={name:'Usuário'},modeloOk=false,_fn=null,_alt=null;
function ask(o){_fn=o.fn;_alt=o.alt?o.alt.fn:null;const b=$('#md');b.innerHTML=`<div class="card" style="max-width:480px;width:100%;margin:0"><h2>${o.t}</h2><div style="margin-bottom:12px">${o.msg}</div>${o.need?`<label style="display:block;margin-bottom:10px" class="mu">Digite <b>${o.need}</b> para confirmar<br><input id="mdi" oninput="mdChk('${o.need}')" style="width:100%;text-align:left"></label>`:''}<div class="row" style="margin:0;justify-content:flex-end"><button class="s" onclick="mdClose()">Cancelar</button>${o.alt?`<button class="s" onclick="mdAlt()">${o.alt.l}</button>`:''}<button class="b" id="mdok" ${o.need?'disabled':''} style="${o.danger?'background:var(--er)':''}" onclick="mdGo()">${o.ok}</button></div></div>`;b.style.display='flex'}
function mdChk(n){$('#mdok').disabled=$('#mdi').value.trim().toUpperCase()!=n}
function mdClose(){$('#md').style.display='none';_fn=null;_alt=null}
function mdGo(){const f=_fn;mdClose();if(f)f()}
function mdAlt(){const f=_alt;mdClose();if(f)f()}
function toast(m){const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4500)}
async function save(){
  try{localStorage.setItem('qgd',JSON.stringify(ST))}catch(e){}
  if(!cref||!ready){$('#st').textContent=db?'Conectando ao banco…':'Salvo neste navegador (banco indisponível)';return}
  const js={};ST.projetos.forEach(p=>js[p.id]=JSON.stringify(p));
  try{
    for(const id of Object.keys(js)){if(lastSaved[id]!==js[id]){await cref.doc('p_'+id).set({json:js[id]});lastSaved[id]=js[id]}}
    for(const id of Object.keys(lastSaved)){if(!js[id]){await cref.doc('p_'+id).delete();delete lastSaved[id]}}
    $('#st').textContent='Salvo no banco ✓'
  }catch(e){$('#st').textContent='Erro ao salvar no banco (salvo neste navegador)'}
}
function pick(id){const f=ST.projetos.find(p=>p.id==id);S=f||newP();ST.sel=f?id:null}
const norm=p=>{p=Object.assign(newP(),p);p.rub.forEach(r=>{if(!r.grupo){const g=p.grupos.find(x=>x.n==String(r.num).split('.')[0]);r.grupo=(g||p.grupos[0]).id}});return p};
function load(j){try{let d=JSON.parse(j);if(!d.projetos)d={projetos:[Object.assign(newP(),d)],sel:null};d.projetos=d.projetos.map(norm);ST=d;pick(ST.sel)}catch(e){}}
async function boot(snap){
  if(snap&&!snap.empty){ST.projetos=snap.docs.map(d=>{try{return norm(JSON.parse(d.data().json))}catch(e){return null}}).filter(Boolean);snap.docs.forEach(d=>{lastSaved[d.id.replace(/^p_/,'')]=d.data().json});pick(ST.sel)}
  else{try{const o=await db.doc('qgd/state').get();if(o.exists&&o.data().json)load(o.data().json)}catch(e){}}
  ready=true;await save();render()}
async function init(){
  try{localStorage.getItem('qgd')&&load(localStorage.getItem('qgd'))}catch(e){}
  render();
  try{
    try{const u=await claude.use('user'),m=await u.me();ME={id:m.id,name:m.name||'Usuário',email:m.email}}catch(e){}
    db=await claude.use('db');
    if(db){cref=db.collection('projetos');let first=true;
      const t=setTimeout(()=>{if(first){first=false;boot(null)}},8000);
      cref.onSnapshot(snap=>{if(!first)return;if(snap.empty&&snap.metadata.fromCache)return;first=false;clearTimeout(t);boot(snap)},()=>{if(first){first=false;boot(null)}});
    }
  }catch(e){}
}
const fm=()=>months().filter(m=>(!flt.y||m.startsWith(flt.y))&&(!flt.m||m.slice(5)==flt.m));
/* ---------- cálculos ---------- */
const D=s=>s?new Date(s+'T12:00:00'):null;
function tempo(){const a=D(S.proj.inicio),b=D(S.proj.fim);if(!a||!b||b<=a)return null;return Math.min(1,Math.max(0,(Date.now()-a)/(b-a)))}
function mesesAteFim(){const b=D(S.proj.fim);if(!b)return null;const n=new Date();return (b.getFullYear()-n.getFullYear())*12+b.getMonth()-n.getMonth()+(b.getDate()<n.getDate()?-1:0)}
function months(){const a=D(S.proj.inicio),b=D(S.proj.fim);if(!a||!b)return[];const o=[];let y=a.getFullYear(),m=a.getMonth();while(y<b.getFullYear()||(y==b.getFullYear()&&m<=b.getMonth())){o.push(y+'-'+String(m+1).padStart(2,'0'));if(++m>11){m=0;y++}if(o.length>120)break}return o}
const aj=id=>S.ajustes.filter(a=>a.rid==id).reduce((s,a)=>s+a.valor,0);
const base=r=>r.qtd*r.mensal, glob=r=>base(r)+aj(r.id), gasto=r=>Object.values(S.gastos[r.id]||{}).reduce((s,v)=>s+(+v||0),0);
function status(r){const g=glob(r),s=gasto(r),t=tempo();if(s>g+0.005)return['er','Estourou o saldo'];if(g<=0)return['ok','—'];const p=s/g;if(t!==null){if(p>=.7&&p>t*1.1)return['wa','Ritmo de gasto acima do tempo – atenção'];if(t>=.3&&p<t*.6)return['in','Sobra de saldo prevista']}else if(p>=.7)return['wa','≥70% do valor gasto'];return['ok','Dentro do esperado']}
const T=()=>({g:S.rub.reduce((s,r)=>s+glob(r),0),s:S.rub.reduce((s,r)=>s+gasto(r),0),b:S.rub.reduce((s,r)=>s+base(r),0)});
const nk=n=>String(n).split('.').map(x=>x.padStart(3,'0')).join('.');
const sorted=()=>[...S.rub].sort((a,b)=>nk(a.num).localeCompare(nk(b.num)));
/* ---------- gráfico svg ---------- */
function bars(items,w=620,h=230){ // items:[label,v1,v2]
  const mx=Math.max(1,...items.flatMap(i=>[i[1],i[2]])),bw=Math.max(8,(w-50)/items.length);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px"><g font-size="10" fill="var(--mu)">`+items.map((i,k)=>{const x=40+k*bw,a=i[1]/mx*(h-50),b=i[2]/mx*(h-50);
    return `<rect x="${x}" y="${h-30-a}" width="${bw*.4}" height="${a}" fill="var(--pr)"/><rect x="${x+bw*.4}" y="${h-30-b}" width="${bw*.4}" height="${b}" fill="var(--wa)"/><text x="${x}" y="${h-16}">${H(i[0])}</text>`}).join('')+`<text x="0" y="10">${R(mx)}</text></g></svg>`}
/* ---------- telas ---------- */
const V={};
V.dash=()=>{const t=T(),tp=tempo(),mf=mesesAteFim();let h='';
  if(mf!==null&&mf<=4&&mf>=0)h+=`<div class="banner">⚠️ Faltam ${mf} mês(es) para o fim do projeto (${D(S.proj.fim).toLocaleDateString('pt-BR')}).</div>`;
  if(mf!==null&&mf<0)h+=`<div class="banner">Projeto encerrado em ${D(S.proj.fim).toLocaleDateString('pt-BR')}.</div>`;
  const rec=S.repasses.filter(x=>x.recebido).reduce((s,x)=>s+x.valor,0),prev=S.repasses.filter(x=>!x.recebido).reduce((s,x)=>s+x.valor,0);
  h+=`<div class="grid"><div class="card kpi"><small>Valor global do projeto</small><b>${R(t.g)}</b></div><div class="card kpi"><small>Total gasto</small><b>${R(t.s)}</b></div><div class="card kpi"><small>Saldo do projeto</small><b>${R(t.g-t.s)}</b></div><div class="card kpi"><small>% gasto × % tempo</small><b>${t.g?P(t.s/t.g):'0%'} × ${tp===null?'–':P(tp)}</b></div><div class="card kpi"><small>Repasses recebidos / a receber</small><b>${R(rec)}</b><small>a receber: ${R(prev)}</small></div></div>`;
  const st=S.rub.map(r=>status(r)[0]),c=k=>st.filter(x=>x==k).length;
  h+=`<div class="card"><h2>Semáforo das rubricas</h2><span class="dot ok"></span>${c('ok')} ok &nbsp; <span class="dot wa"></span>${c('wa')} atenção &nbsp; <span class="dot er"></span>${c('er')} estouradas &nbsp; <span class="dot in"></span>${c('in')} com sobra</div>`;
  const grp=S.grupos.map(g=>{const rs=S.rub.filter(r=>r.grupo==g.id);return[g.nome.slice(0,10),rs.reduce((s,r)=>s+glob(r),0),rs.reduce((s,r)=>s+gasto(r),0)]});
  const ms=months().map(m=>[m.slice(5)+'/'+m.slice(2,4),S.rub.reduce((s,r)=>s+(+(S.gastos[r.id]||{})[m]||0),0),0]);
  h+=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div class="card"><h2>Global × gasto por grupo de despesa</h2><span class="dot" style="background:var(--pr)"></span>Global <span class="dot wa"></span>Gasto${bars(grp)}</div><div class="card"><h2>Gasto por mês</h2>${ms.length?bars(ms.map(x=>[x[0],x[1],0])):'<span class="mu">Defina as datas do projeto.</span>'}</div></div>`;
  h+=`<div class="card"><h2>Rubricas em atenção</h2><div class="sc"><table><tr><th>Rubrica</th><th class="n">Saldo</th><th>Situação</th></tr>${sorted().filter(r=>status(r)[0]!='ok').map(r=>{const s=status(r);return`<tr><td>${r.num} ${H(r.desc)}</td><td class="n">${R(glob(r)-gasto(r))}</td><td><span class="dot ${s[0]}"></span>${s[1]}</td></tr>`}).join('')||'<tr><td colspan=3 class="mu">Nenhuma.</td></tr>'}</table></div></div>`;
  return h+dashExtra()};
V.rub=()=>{const tp=tempo();let h=`<div class="card"><h2>Nova rubrica</h2><div class="row"><label>Grupo / despesa<span style="display:flex;gap:4px;align-items:center"><select id="rg" onchange="flt.rg=this.value">${S.grupos.map(g=>`<option value="${g.id}" ${g.id==flt.rg?'selected':''}>${H(g.nome)}</option>`).join('')}</select><button class="s" title="Cadastrar novo grupo" onclick="flt.ng=!flt.ng;render()">+</button>${flt.ng?`<input id="ngn" placeholder="Nome do novo grupo" size="22"><button class="b" onclick="saveG()">Salvar grupo</button>`:''}</span></label><label>Nº (opcional)<input id="rn" size="5" placeholder="auto"></label><label>Descrição<input id="rd" size="34"></label><label>Qtd. meses<input id="rq" type="number" value="24" style="width:80px"></label><label>Valor mensal (R$)<input id="rm" type="number" step="0.01" style="width:130px"></label><button class="b" onclick="addRub()">Adicionar</button><button class="s" onclick="modelo()">Carregar modelo da planilha (2º contrato)</button><button class="s" onclick="csv()">Exportar Excel/CSV</button><button class="s" onclick="try{print()}catch(e){}">PDF / Imprimir</button></div></div>`;
  const f=flt.g,col=flt.col||(flt.col={}),match=r=>(r.num+r.desc).toLowerCase().includes(f.toLowerCase()),LF=sorted().filter(match);
  h+=`<div class="card"><div class="row"><label>Filtrar rubrica<input value="${H(f)}" oninput="flt.g=this.value;render(true)"></label><button class="s" onclick="toggleAll()">${allCol()?'Expandir grupos':'Recolher grupos'}</button></div></div><div class="card"><div class="gt"><table class="gtb"><thead><tr><th class="stk">Rubrica</th><th class="n">Meses</th><th class="n">Mensal</th><th class="n">Global (c/ ajustes)</th><th class="n">Gasto</th><th class="n">Saldo</th><th>Gasto × tempo</th><th>Situação</th><th></th></tr></thead><tbody>`;
  [...S.grupos].sort((a,b)=>a.n-b.n).forEach(G=>{const rs=LF.filter(r=>r.grupo==G.id);if(!rs.length&&f)return;const c=col[G.id];
    h+=`<tr class="g" onclick="flt.col['${G.id}']=!flt.col['${G.id}'];render()" style="cursor:pointer"><td class="stk">${c?'▸':'▾'} ${H(G.nome)} <span class="mu">(${rs.length})</span> ${rs.length?'':`<button class="x" onclick="event.stopPropagation();delG('${G.id}')">excluir grupo vazio</button>`}</td><td></td><td class="n">${R(rs.reduce((a,x)=>a+x.mensal,0))}</td><td class="n">${R(rs.reduce((a,x)=>a+glob(x),0))}</td><td class="n">${R(rs.reduce((a,x)=>a+gasto(x),0))}</td><td class="n">${R(rs.reduce((a,x)=>a+glob(x)-gasto(x),0))}</td><td colspan="3"></td></tr>`;
    if(!c)rs.forEach(r=>{const g=glob(r),s=gasto(r),p=g?Math.min(1,s/g):0,st=status(r);if(flt.er==r.id){h+=editRow(r);return}
      h+=`<tr><td class="stk"><span class="dot ${st[0]}" title="${st[1]}"></span><b>${H(r.num)}</b> ${H(r.desc)}</td><td class="n">${r.qtd}</td><td class="n">${R(r.mensal)}</td><td class="n">${R(g)}</td><td class="n">${R(s)}</td><td class="n" style="${g-s<0?'color:var(--er);font-weight:600':''}">${R(g-s)}</td><td><div class="bar"><i class="${st[0]}" style="width:${p*100}%"></i>${tp!==null?`<u style="left:${tp*100}%"></u>`:''}</div></td><td>${st[1]}</td><td><button class="x" style="color:var(--pr)" onclick="flt.er='${r.id}';render()">editar</button> <button class="x" onclick="delRub('${r.id}')">excluir</button></td></tr>`})});
  h+=`<tr class="g"><td class="stk">TOTAL${f?' (filtro)':' GERAL'}</td><td></td><td class="n">${R(LF.reduce((a,x)=>a+x.mensal,0))}</td><td class="n">${R(LF.reduce((a,x)=>a+glob(x),0))}</td><td class="n">${R(LF.reduce((a,x)=>a+gasto(x),0))}</td><td class="n">${R(LF.reduce((a,x)=>a+glob(x)-gasto(x),0))}</td><td colspan="3"></td></tr></tbody></table></div></div><p class="mu">Clique na linha de um grupo para recolher ou expandir. Valor global = qtd. meses × valor mensal ± aditivos, supressões e remanejamentos. 🟡 gasto ≥70% do saldo e acima do ritmo do tempo · 🔴 gasto &gt; valor global · 🔵 gasto bem abaixo do ritmo do tempo (sobra). A barra preta marca o % de tempo decorrido.</p>`;return h};
V.gas=()=>{const all=months(),ms=fm();if(!all.length)return`<div class="card">Defina as datas de início e fim do projeto (início: ${S.proj.inicio||'não definido'} · fim: ${S.proj.fim||'não definido'}${S.proj.inicio&&S.proj.fim&&S.proj.fim<S.proj.inicio?' – o fim deve ser depois do início':''}). <button class="b" onclick="tab='pro';render()">Ir para a aba Projeto</button></div>`;

function setG(r,m,v){const o=(S.gastos[r]||{})[m],n=v===''?0:+v;if((+o||0)!==n)lg('gasto',r,'Gasto '+m.slice(5)+'/'+m.slice(0,4),o===undefined?0:o,n,true);(S.gastos[r]=S.gastos[r]||{})[m]=n;save();render()}
function addAj(){const n0=S.ajustes.length,t=$('#at').value,v=Math.abs(+$('#av').value),d=$('#ad').value,r=$('#ar').value,o=$('#ao').value,obs=$('#aobs').value;if(!v||!r||!d)return;
  if(t=='remanejamento'){if(o==r)return toast('Origem e destino devem ser diferentes');S.ajustes.push({id:uid(),data:d,tipo:t,rid:o,valor:-v,obs:'Saída p/ destino. '+obs},{id:uid(),data:d,tipo:t,rid:r,valor:v,obs:'Entrada da origem. '+obs})}
  else S.ajustes.push({id:uid(),data:d,tipo:t,rid:r,valor:t=='supressao'?-v:v,obs});S.ajustes.slice(n0).forEach(a=>lg('ajuste',a.rid,a.tipo,'',a.valor,true,D(a.data).toLocaleDateString('pt-BR')+(a.obs?' · '+a.obs:'')));upd()}
function addFor(){const n=$('#fn').value.trim(),r=S.rub.find(x=>x.id==$('#fr').value);if(!n||!r)return;(r.forn=r.forn||[]).push({nome:n,data:$('#fd').value,obs:$('#fo').value});upd()}
function addRep(){const n=+$('#rp').value||1,v=+$('#rv').value,d=D($('#rdt').value);if(!v||!d)return;for(let i=0;i<n;i++){const x=new Date(d);x.setMonth(x.getMonth()+i);const x2={id:uid(),data:x.toISOString().slice(0,10),valor:v,recebido:false};S.repasses.push(x2);lg('repasse','','Repasse previsto em '+D(x2.data).toLocaleDateString('pt-BR'),'',v,true)}upd()}
function recb(id,c){const x=S.repasses.find(x=>x.id==id);lg('repasse','','Repasse de '+D(x.data).toLocaleDateString('pt-BR')+' – situação',x.recebido?'Recebido':'A receber',c?'Recebido':'A receber',false,R(x.valor));x.recebido=c;upd()}
function delRep(id){const x=S.repasses.find(y=>y.id==id);if(!x)return;ask({t:'Excluir repasse?',msg:`Repasse de ${D(x.data).toLocaleDateString('pt-BR')} no valor de <b>${R(x.valor)}</b> (${x.recebido?'recebido':'a receber'}). A exclusão fica registrada no histórico.`,ok:'Excluir repasse',danger:1,fn:()=>{lg('repasse','','Repasse excluído ('+D(x.data).toLocaleDateString('pt-BR')+')',x.valor,0,true);S.repasses=S.repasses.filter(y=>y.id!=id);upd()}})}
function setPro(){const o=S.proj,n={nome:$('#pn').value,inicio:$('#pi').value,fim:$('#pf').value};[['nome','Nome do projeto'],['inicio','Data de início'],['fim','Data de fim']].forEach(([k,c])=>{if((o[k]||'')!==n[k])lg('projeto','',c,o[k]||'',n[k])});S.proj=n;upd()}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demo(){
  if(ST.projetos.some(p=>p.demo))return;
  const nowM=today().slice(0,7),td=today(),FN=['Alfa Logística Ltda','Sport Prime Comércio','Contábil Nordeste','Gráfica Recife Express','Locadora Veloz','Jurídico & Associados','TechInfo Soluções','Limpeza Total EIRELI'];
  [{n:'Núcleos de Base Esportivos (DEMO)',c:'DEMO-001',ini:'2025-08-01',fim:'2027-07-31',k:1,sp:{8:1.8,5:1.3,12:.3,20:1.3}},
   {n:'Mais Competições Regionais (DEMO)',c:'DEMO-002',ini:'2026-03-01',fim:'2027-02-28',k:.45,sp:{3:1.5,10:.35,15:1.25,22:1.9}},
   {n:'Formação de Atletas Sub-17 (DEMO)',c:'DEMO-003',ini:'2026-01-01',fim:'2027-12-31',k:.7,sp:{1:1.35,9:.3,17:.4,24:1.25}}].forEach((d,pi)=>{
    const rnd=rng(100+pi*7),p=newP(d.n),mm=[];p.cod=d.c;p.demo=true;p.proj.inicio=d.ini;p.proj.fim=d.fim;
    let y=+d.ini.slice(0,4),mo=+d.ini.slice(5,7);const ye=+d.fim.slice(0,4),me=+d.fim.slice(5,7);
    while(y<ye||(y==ye&&mo<=me)){mm.push(y+'-'+String(mo).padStart(2,'0'));if(++mo>12){mo=1;y++}}
    p.rub=MOD().map(x=>({id:uid(),grupo:(p.grupos.find(g=>g.n==String(x[0]).split('.')[0])||p.grupos[0]).id,num:String(x[0]),desc:x[1],qtd:mm.length,mensal:Math.round(x[2]*d.k*100)/100,forn:[]}));
    p.rub.forEach((r,i)=>{const f=d.sp[i]||(i==0?1:.93+rnd()*.14),g=p.gastos[r.id]={};
      mm.filter(m=>m<=nowM).forEach(m=>{g[m]=Math.round(r.mensal*f*(.94+rnd()*.12)*100)/100});
      if(i%3==1){r.forn.push({nome:FN[(i+pi)%8],data:d.ini,obs:'Contrato inicial'});if(i%6==1)r.forn.push({nome:FN[(i+pi+3)%8],data:mm[Math.min(6,mm.length-1)]+'-10',obs:'Troca de fornecedor por melhor preço'})}});
    const a=p.rub[1],b=p.rub[3],c=p.rub[9],d1=mm[Math.min(5,mm.length-1)]+'-15',d2=mm[Math.min(9,mm.length-1)]+'-10';
    p.ajustes.push({id:uid(),data:d1,tipo:'aditivo',rid:a.id,valor:Math.round(a.mensal*3),obs:'Aditivo para ampliar logística'},{id:uid(),data:d1,tipo:'supressao',rid:c.id,valor:-Math.round(c.mensal*2),obs:'Supressão por redução de escopo'},{id:uid(),data:d2,tipo:'remanejamento',rid:c.id,valor:-Math.round(c.mensal),obs:'Saída p/ destino. Ajuste de execução'},{id:uid(),data:d2,tipo:'remanejamento',rid:b.id,valor:Math.round(c.mensal),obs:'Entrada da origem. Ajuste de execução'});
    p.hist=p.ajustes.map(a=>{const r=p.rub.find(x=>x.id==a.rid);return{id:uid(),ts:a.data+'T12:00:00.000Z',tipo:'ajuste',rid:a.rid,rn:r.num+' '+r.desc,campo:a.tipo,de:'',para:a.valor,m:true,obs:a.obs,u:'Demonstração'}});const e2=p.rub[2];p.hist.push({id:uid(),ts:d1+'T15:30:00.000Z',tipo:'rubrica',rid:e2.id,rn:e2.num+' '+e2.desc,campo:'Valor mensal',de:Math.round(e2.mensal*.9*100)/100,para:e2.mensal,m:true,obs:'Reajuste contratual',u:'Demonstração'});const tm=p.rub.reduce((s,r)=>s+r.mensal,0);
    for(let k=0;k<mm.length;k+=3){const dt=mm[k]+'-05';p.repasses.push({id:uid(),data:dt,valor:Math.round(tm*Math.min(3,mm.length-k)),recebido:dt<=td})}
    ST.projetos.push(p)});
  gsel='';view='geral';save();render()}
function delDemo(){ST.projetos=ST.projetos.filter(p=>!p.demo);if(!ST.projetos.find(p=>p.id==ST.sel))pick(null);gsel='';save();render()}
function modelo(){if(S.rub.length&&!modeloOk){ask({t:'Adicionar rubricas do modelo?',msg:'Este projeto já tem rubricas. As rubricas do modelo serão adicionadas às existentes.',ok:'Adicionar',fn:()=>{modeloOk=true;modelo();modeloOk=false}});return}
  const m=MOD();
  m.forEach(x=>S.rub.push({id:uid(),grupo:(S.grupos.find(g=>g.n==String(x[0]).split('.')[0])||S.grupos[0]).id,num:String(x[0]),desc:x[1],qtd:24,mensal:x[2],forn:[]}));lg('rubrica','','Carga do modelo da planilha','',MOD().length+' rubricas');upd()}
async function csv(){const ms=fm(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rf=r=>(r.num+r.desc).toLowerCase().includes(flt.g.toLowerCase()),pm=r=>ms.reduce((a,m)=>a+(+(S.gastos[r.id]||{})[m]||0),0),rows=[['Nº','Rubrica','Meses','Valor mensal','Valor global',...ms,'Gasto no período','Gasto total','Saldo']];
  sorted().filter(rf).forEach(r=>rows.push([r.num,r.desc,r.qtd,r.mensal,glob(r),...ms.map(m=>(S.gastos[r.id]||{})[m]||0),pm(r),gasto(r),glob(r)-gasto(r)]));
  const L=sorted().filter(rf),G=L.reduce((a,r)=>a+glob(r),0),U=L.reduce((a,r)=>a+gasto(r),0);rows.push(['','TOTAL','','',G,...ms.map(m=>L.reduce((a,r)=>a+(+(S.gastos[r.id]||{})[m]||0),0)),L.reduce((a,r)=>a+pm(r),0),U,G-U]);
  const data='\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n');
  try{const d=await dlr();await d.save({filename:'qgd-financeiro.csv',data})}catch(e){toast('Não foi possível baixar aqui.')}}
init();
</script></body></html>
